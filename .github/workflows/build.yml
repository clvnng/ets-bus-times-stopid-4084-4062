name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libsqlite3-dev \
            sqlite3 \
            bzip2 \
            libssl-dev \
            openssl \
            libffi-dev \
            libgdbm-dev \
            libncursesw5-dev \
            libreadline-dev \
            tk-dev \
            gfortran \
            liblzma-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            unzip \
            zip

      - name: Install Python Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer cython setuptools

      - name: Build APK with Buildozer
        run: |
          # --accept-sdk-license prevents interactive prompts that break the CI run
          buildozer -v android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk